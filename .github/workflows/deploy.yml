# main -> mindscopecares.com. Builds once per commit, deploys a named revision
# with no traffic, smoke-tests it, then moves the site to it.
# Roll back: re-run an older successful Deploy run, or
#   gcloud run services update-traffic mindscope-landing --to-revisions REV=100
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/mindscope-landing

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mindscopecares.com
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push
        run: |
          docker build --build-arg VERSION="${GITHUB_SHA::7}" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy revision (no traffic yet)
        run: |
          suffix="main-${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}"
          echo "REV=${{ vars.CLOUD_RUN_SERVICE }}-$suffix" >> "$GITHUB_ENV"
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE:$GITHUB_SHA" --revision-suffix "$suffix" --no-traffic --tag candidate --quiet
      - name: Smoke test candidate
        run: |
          url=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format=json |
            python3 -c "import json,sys; print(next(t['url'] for t in json.load(sys.stdin)['status']['traffic'] if t.get('tag')=='candidate'))")
          curl -fsS "$url/health"
          [ "$(curl -fsS "$url/version.txt")" = "${GITHUB_SHA::7}" ]
          curl -fsS -o /dev/null "$url/"
      - name: Go live
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --to-revisions "$REV=100" --remove-tags candidate --quiet
          echo "### Live: \`$REV\` on https://mindscopecares.com" >> "$GITHUB_STEP_SUMMARY"
