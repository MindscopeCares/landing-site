# Deploy on merge: build the site and publish it to Firebase Hosting in
# mindscope-prod (site `mindscope-prod`, served at mindscopecares.com).
# Auth is GitHub OIDC -> Workload Identity Federation; there are no keys.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hosting-live
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_TOOLS: firebase-tools@15.37.0

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci && npm run build
        working-directory: website
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Deploy to the live channel
        working-directory: website
        run: |
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting:mindscopecares \
            --project mindscope-prod --non-interactive \
            --message "${GITHUB_SHA::7}"
      - name: Check the site answers
        run: |
          curl -fsS -o /dev/null -w 'mindscope-prod.web.app -> %{http_code}\n' https://mindscope-prod.web.app/
          echo "### Deployed ${GITHUB_SHA::7} to https://mindscope-prod.web.app (mindscopecares.com)" >> "$GITHUB_STEP_SUMMARY"
