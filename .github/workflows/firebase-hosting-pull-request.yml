# Preview every PR from this repo on its own Firebase Hosting channel
# (expires after 7 days) and comment the URL on the PR.
# Auth is GitHub OIDC -> Workload Identity Federation; there are no keys.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  FIREBASE_TOOLS: firebase-tools@15.37.0

jobs:
  build_and_preview:
    # Forks get no OIDC token, so they can't deploy previews.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci && npm run build
        working-directory: website
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Deploy the preview channel
        id: preview
        working-directory: website
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --only mindscopecares --project mindscope-prod --expires 7d --non-interactive --json > /tmp/preview.json
          url=$(python3 -c "import json; r=json.load(open('/tmp/preview.json'))['result']; print(next(iter(r.values()))['url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="Preview for ${GITHUB_SHA::7}: $URL (expires in 7 days)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview for"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
