name: Roll back production
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Known-good production revision to restore
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authorize releaser
        env:
          MANAGERS: ${{ vars.RELEASE_MANAGERS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo ",$MANAGERS," | tr -d ' ' | grep -qi ",$ACTOR," || exit 1
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Restore known-good revision
        env:
          REVISION: ${{ inputs.revision }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          owner=$(gcloud run revisions describe "$REVISION" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format=json | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["labels"]["serving.knative.dev/service"])')
          [ "$owner" = "$SERVICE" ] || { echo "Revision belongs to a different service"; exit 1; }
          gcloud run services update-traffic "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --to-revisions "$REVISION=100" --quiet
