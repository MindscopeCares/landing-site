# Presubmit for every PR: typecheck, build, and a container smoke test.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tools:
    name: Release safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_release_tools.py -v

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Container serves the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t landing:ci .
      - run: |
          docker run -d -p 8080:8080 landing:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS -o /dev/null localhost:8080/
          curl -fsS -o /dev/null localhost:8080/parents   # SPA route fallback
          # Security headers must survive nginx's per-location add_header rules.
          for path in / /parents; do
            headers=$(curl -fsSI "localhost:8080$path")
            for h in x-frame-options x-content-type-options strict-transport-security content-security-policy; do
              echo "$headers" | grep -qi "^$h:" || { echo "missing $h on $path"; exit 1; }
            done
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, container, release-tools]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.build.result }}" = success ] && [ "${{ needs.container.result }}" = success ] && [ "${{ needs.release-tools.result }}" = success ]'
