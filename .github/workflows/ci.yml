# Presubmit for every PR: typecheck, tests, build, and the hosting config.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  hosting:
    name: Hosting config keeps the security headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_hosting_headers.py website/firebase.json

  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, hosting]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.build.result }}" = success ] && [ "${{ needs.hosting.result }}" = success ]'
