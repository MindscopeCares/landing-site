# Presubmit for every PR: typecheck, build, and a container smoke test.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  container:
    name: Container serves the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t landing:ci .
      - run: |
          docker run -d -p 8080:8080 landing:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS -o /dev/null localhost:8080/
          curl -fsS -o /dev/null localhost:8080/parents   # SPA route fallback

  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, container]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.build.result }}" = success ] && [ "${{ needs.container.result }}" = success ]'
