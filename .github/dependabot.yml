version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    groups:
      npm: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
