server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Served on both mindscopecares.com and www.mindscopecares.com.

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health { access_log off; return 200 "ok\n"; }

  # Fingerprinted build assets: cache forever.
  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (react-router) fall back to the SPA shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
