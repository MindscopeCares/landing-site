server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # www -> apex (canonical host). Cloud Run sets Host to the mapped domain.
  if ($host = "www.mindscopecares.com") {
    return 301 https://mindscopecares.com$request_uri;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health { access_log off; return 200 "ok\n"; }

  # Fingerprinted build assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (react-router) fall back to the SPA shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
